name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # Fails when schema.ts changed without a generated migration.
      - run: pnpm db:generate && test -z "$(git status --porcelain drizzle)"
      # Migrations, seed and Drizzle repos on an in-process Postgres. No database needed.
      - run: pnpm test:unit
      - run: pnpm exec playwright install --with-deps chromium
      # Builds and starts the app itself; no network needed.
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
